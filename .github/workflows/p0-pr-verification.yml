name: StayBid PR verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install PostgreSQL 16 binaries
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-16

      - name: Check pull request whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

      - name: Verify pricing-engine schema contract
        run: node tests/pricing-engine-schema-contract.test.js

      - name: Verify Price Spine occupancy contract
        run: node tests/price-spine-occupancy.test.js

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build production bundle
        run: npm run build

      - name: Run security regression suite
        run: npm run test:security

      - name: Run concurrency regression suite
        run: npm run test:concurrency
